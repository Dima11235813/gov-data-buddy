<div class="bills-container">
  <mat-card>

    <mat-card-content>
      <div class="toolbar" *ngIf="!loading && !error && bills.length > 0">
        <div class="search">
          <app-search-input placeholder="Search bills by title or number..." [value]="searchQuery" (valueChange)="onSearchChange($event)"></app-search-input>
        </div>
        <div class="filters">
          <app-status-select [value]="statusFilter" (valueChange)="onStatusChange($event)"></app-status-select>
        </div>
      </div>

      <div class="loading" *ngIf="loading">
        <mat-spinner></mat-spinner>
        <p>Loading bills...</p>
      </div>

      <div class="bills-list" *ngIf="!loading && !error && filteredBills.length > 0">
        <app-bill-card *ngFor="let bill of filteredBills" [bill]="bill"></app-bill-card>
      </div>

      <app-no-data
        *ngIf="!loading && !error && bills.length === 0"
        message="No Bills Available"
        subtitle="There are currently no bills to display. Check back later for updates."
        icon="inbox">
      </app-no-data>

      <app-no-data
        *ngIf="!loading && !error && bills.length > 0 && filteredBills.length === 0"
        message="No Bills Match Your Search"
        subtitle="Try adjusting your search terms or filters to find what you're looking for."
        icon="search_off">
      </app-no-data>

      <app-service-unavailable
        *ngIf="!loading && error"
        message="Unable to Load Bills"
        subtitle="We're having trouble connecting to the server. Please check your connection and try again."
        (retryClicked)="onRetry()">
      </app-service-unavailable>
    </mat-card-content>
  </mat-card>
</div>
