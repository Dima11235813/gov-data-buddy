<div class="bills-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Congressional Bills</mat-card-title>
      <mat-card-subtitle>Recent legislative activity from Congress.gov</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="loading" *ngIf="loading">
        <mat-spinner></mat-spinner>
        <p>Loading bills...</p>
      </div>

      <div class="bills-list" *ngIf="!loading && bills.length > 0">
        <div class="bill-item" *ngFor="let bill of bills">
          <h3>{{ bill.title || bill.number }}</h3>
          <p *ngIf="bill.latestAction">
            <strong>Latest Action:</strong> {{ bill.latestAction.text }}
            <span *ngIf="bill.latestAction.actionDate">
              ({{ bill.latestAction.actionDate }})
            </span>
          </p>
          <p *ngIf="bill.introducedDate">
            <strong>Introduced:</strong> {{ bill.introducedDate }}
          </p>
          <button mat-button color="primary" *ngIf="bill.url">
            View Details
          </button>
        </div>
      </div>

      <div class="no-bills" *ngIf="!loading && bills.length === 0">
        <p>No bills available at this time.</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
