<div class="page-header">
  <div class="header-content">
    <div class="titles">
      <h1 class="page-title">{{ pageHeading }}</h1>
      <p class="subtitle" *ngIf="subtitle">{{ subtitle }}</p>
    </div>
    <nav class="nav-links" *ngIf="showNav">
      <button mat-button routerLink="/" routerLinkActive="active">
        <mat-icon>home</mat-icon>
        Home
      </button>
      <button mat-button routerLink="/bills" routerLinkActive="active">
        <mat-icon>description</mat-icon>
        Bills
      </button>
      <button mat-button routerLink="/committee" routerLinkActive="active">
        <mat-icon>account_balance</mat-icon>
        Committees
      </button>
    </nav>
  </div>
</div>
