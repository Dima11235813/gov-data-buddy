<a class="button-card" [routerLink]="routerLink" (click)="onClick()">
  <div class="icon" *ngIf="icon">
    <mat-icon>{{ icon }}</mat-icon>
  </div>
  <div class="content">
    <h3>{{ title }}</h3>
    <p>{{ description }}</p>
    <span class="cta">Explore <mat-icon>arrow_forward</mat-icon></span>
  </div>
</a>
