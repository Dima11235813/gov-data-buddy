<header class="site-header">
  <div class="container">
    <app-link class="brand" [routerLink]="['/']" ariaLabel="Government Data Buddy home">
      <mat-icon class="brand-icon">account_balance</mat-icon>
      <span class="brand-text">Government Data Buddy</span>
    </app-link>

    <nav class="nav-links" aria-label="Primary">
      <app-link materialStyle="button" [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</app-link>
      <app-link materialStyle="button" [routerLink]="['/bills']" routerLinkActive="active">Bills</app-link>
      <app-link materialStyle="button" [routerLink]="['/members']" routerLinkActive="active">Members</app-link>
      <app-link materialStyle="button" [routerLink]="['/committee']" routerLinkActive="active">Committees</app-link>
    </nav>

    <div class="nav-actions">
      <app-link class="btn-link" materialStyle="raised" color="primary" [routerLink]="['/bills']">
        <mat-icon>search</mat-icon>
        <mat-text-column>
          Start Your Search
        </mat-text-column>
      </app-link>
    </div>
  </div>
</header>
