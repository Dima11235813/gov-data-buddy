<div class="agency-table-card">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Agency Information</mat-card-title>
      <mat-card-subtitle>Current government agencies and their data</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <table mat-table [dataSource]="agencies" class="agency-table">

          <!-- Agency Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Agency Name</th>
            <td mat-cell *matCellDef="let agency">{{ agency.name }}</td>
          </ng-container>

          <!-- Type Column -->
          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef>Type</th>
            <td mat-cell *matCellDef="let agency">{{ agency.type }}</td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let agency">
              <mat-chip [color]="getStatusColor(agency.status)" selected>
                {{ agency.status }}
              </mat-chip>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let agency">
              <button mat-icon-button color="primary" (click)="viewDetails(agency)">
                <mat-icon>visibility</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <div class="no-data" *ngIf="agencies.length === 0">
          <mat-icon>info</mat-icon>
          <p>No agency data available</p>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
